[dimensions]
# (k1) Outlier exclusion: maximum number of deaths
death_outliers = [
    "no_exclusion",           # nothing dropped
    "drop_katrina",           # drop Katrina (1833 deaths)
    "drop_katrina_audrey",    # drop Katrina and Audrey (>416 deaths)
]

# (k2) Leverage points: maximum number of damages in dollars
damage_outliers = [
    "no_exclusion",           # nothing dropped
    "drop_1_highest_damage",  # drop highest damage
    "drop_2_highest_damage",  # drop 2 highest damage
    "drop_3_highest_damage",  # drop 3 highest damage
]

# (k3) Femininity operationalisation
femininity = [
    "female_dummy",           # binary dummy (1=female, 0=male)
    "masfem_rating",          # continuous femininity rating from MTurk (1-11)
]

# (k4) Model specification
model = [
    "ols_log",                # OLS on log(deaths+1)
    "negative_binomial",      # negative binomial on raw death count
]

# (k5) Damages functional form
damage_transform = [
    "linear",                 # damages in dollars
    "log",                    # log(damages)
]

# (k6) Femininity predictor specification
predictor_spec = [
    "x_damages",                      # femininity × damages only
    "x_damages_pressure",             # + femininity × min pressure
    "x_damages_wind",                 # + femininity × max wind
    "x_damages_category",             # + femininity × hurricane category
    "x_damages_all",                  # + femininity × mean(pressure,wind,cat)
    "main_effect_only",               # no interaction, main effects only
]

# (k7) Year covariates
covariates = [
    "none",                   # no year controls
    "year_x_damages",         # year × damages interaction
    "post1979_x_damages",     # post-1979 dummy × damages interaction
]
